# Feynman-PRM phase-1 config.
#
# Strict-parsed (feynman_prm/config.py): an unknown or misspelled key is a HARD ERROR,
# because "config value silently ignored, library default used" is old bug B4.
#
# Every TMD-derived number carries its provenance. Where CLAUDE.md and the TMD repo
# disagree, the repo wins unless §7 states an explicit reasoned divergence.
#
# NOT config, because they must never vary (PLAN "Config"): fp32 distances (mandatory,
# bug B10a), pad-to-batch-max, the separator-after-prompt, strip_step_prefix,
# log_selection_sha, add_step_prefix at eval, report_math_leak_split, layer_norm on the
# psi/phi hidden layers, and hidden_size (always read from the downloaded config.json).

run:
  name: phase1
  out_dir: runs
  seed: 42

model:
  name: Qwen/Qwen2.5-Math-1.5B-Instruct
  lora:
    r: 16
    alpha: 16
    dropout: 0.0                 # 7 Qwen2 attn+MLP projections. NEVER a head. §6.2, §14
  gradient_checkpointing: true
  attn_implementation: sdpa      # already a fused flash-family kernel. flash_attention_2 is
                                 # selectable IF a cp312/cu128/sm_120 wheel ever installs -
                                 # worth ~2% of FLOPs, not the lever (PLAN 4a). NO flash-attn dep.

heads:
  latent_dim: 512                # tmd get_config(). NOT 1536 -> that was ~80% symmetric (old R6)
  hidden_dims: [512, 512, 512]   # networks.py:531-542
  ensemble: false                # TMD uses 2 + min(); off per human call. §16.6
  action_pool: mean              # mean | attention   (§6.4, §16.7)

distance:
  variant: full_mrn              # full_mrn | asym_only | iqe   (tmd.py:28-66)
  components: 8                  # K, tmd get_config()

data:
  dir: data/processed
  max_len: 1024                  # rows over this are DROPPED, never truncated (~0.05%, logged)
  sep_token: "\n"                # asserted to be exactly one token id at load (§6.1)
  prompt_format: raw             # raw (CRM-faithful) | chat (Qwen chat template)
  n_questions: 34650             # x 4.33 seqs/question = ~150k seqs/epoch (NOT 9.18 - §11.1)
                                 # RAISED 23000 -> 34650 on 2026-07-28, with the L_good run.
                                 # 34650 x 4.33 = 150,035 sequences -> ~1,460 optimizer steps
                                 # measured-rate (~1,340 analytic; the token cap makes real
                                 # batches ~51 seqs, not 56 - §8.1.2).
                                 # THE POOL IS ~38,247 (40,247 trainable minus the 2,000 val
                                 # holdout), so this takes 91% of it. There is no room for a
                                 # third increase: past ~38k the only lever is train.epochs.
                                 # CHANGING THIS CHANGES THE SELECTION SHA -> re-run
                                 # scripts/prepare_data.py before training, or the parquet
                                 # still holds the 23,000-question selection. The VAL split is
                                 # unaffected (it is drawn before n_questions is applied), so
                                 # val_f1 numbers stay comparable across the change.
  n_val_questions: 2000

# ===================== THE ONE DISCOUNT (locked #9) =====================
# Read in TWO places and it is the SAME number in both, exactly as in TMD:
#   1. goal sampler  - datasets.py:263  how far ahead training goals are drawn
#   2. backup gamma  - tmd.py:110       per-good-step cost = -log(discount)
# Pick it on GOAL VARIETY alone (§4.5). Do NOT reintroduce a second key (§7.8).
discount: 0.5                    # CHOSEN 2026-07-25. -log = 0.69315, 41.1% endings, 4.19 distinct
                                 # 0.7 = sanctioned fallback (-log 0.35667, 55.0%, 3.45 distinct)
                                 # NOT TMD's 0.99: 1.16 distinct goals = old root cause B

sampling:
  sequences_per_micro_batch: 56
  max_padded_tokens: 32768       # THE SECOND BUDGET. A batch closes when it would break
                                 # either this or the sequence count, because a batch costs
                                 # len(batch) x max_len on the GPU, not len(batch).
                                 # MEASURED 2026-07-27 (scripts/batch_report.py), after the
                                 # PLAN 4a probe OOMed at 57,344 tok on a 15.46 GiB card:
                                 #   lengths p50 248, p90 514, 0.7% above 896 -> the median
                                 #   batch is 19,423 tok and the worst is 57,344, so only
                                 #   17% of batches are over this cap.
                                 # 32768 costs 5% of L_NCE's mean pool (R 364 -> 344) and
                                 # NOTHING at p10 (177 -> 176): thin pools live on SHORT
                                 # batches, oversized batches carry the LARGEST pools.
                                 # Cutting sequences_per_micro_batch instead shrinks every
                                 # batch: 28 seqs halves R to 175 and Q to 6.0. Do that only
                                 # if the cap alone cannot fit the card.
                                 # ~11.5 GiB peak, 1943 batches, 971 steps, grad_accum stays 2.
                                 # 40960 measures ~13.4 GiB - inside the error bar. Re-run
                                 # batch_report.py before raising it.
  max_correct_per_question: 4    # CAPS, not quotas: min(cap, available). median is 2. §4.2.1
  max_incorrect_per_question: 3
  nce_mask_same_traj: false      # locked #12 - we want the negatives
  group_by_length: true          # ~60% -> ~10% padding, est. 4h -> 2h/epoch. Peak mem 9->12 GB,
                                 # so the longest batch runs FIRST as a probe. false = spec order.
                                 # Q stays ~12.9 and every §8.1.1 count holds either way (PLAN 4a).

losses:
  lambda_nce: 1.0                # (1) L_NCE   §7.2
  lambda_i: 1.0                  # (2) L_I     §7.3  TMD puts invariance at 1.0, NOT under zeta
  zeta: 0.05                     # (3) L_T     §7.4  weights the BACKUP ONLY - tmd.py:124
  lambda_cf: 0.0                 # (4) L_CF    §7.5  data deferred (§2 #4)
  lambda_step: 1.0               # (5) L_step  §7.6  carries correctness. not optional (§7.6.2)
  lambda_good: 1.0               # (6) L_good  §7.12 THE FALSE-POSITIVE TERM. ON since
                                 # 2026-07-28 - the §16.21 sign-off, given by the human after
                                 # the step-750 measurement below. It shipped at 0.0 for
                                 # exactly one day.
                                 # Nothing else in the loss set bounds a good step's Delta
                                 # from ABOVE: at L_I's optimum the MRN forces
                                 # d(phi_i,g) >= d(psi_{i-1},g), so the -A term of
                                 #   Delta_i = -0.693 - A_i - B_i
                                 # is >= 0 with no ceiling. Measured at step 750: good-step
                                 # Delta mean +0.240, P(Delta > 0.347) = 0.34, fitted tau
                                 # driven to 2.39, F1 capped at 0.456 (§7.12).
                                 # 1.0 is UNVALIDATED like every other weight (§16.8). The
                                 # weak claim is that it does not drown L_step (~660 terms vs
                                 # ~67 pairs) -- MEASURED SMALL: probe03/gap RISES with lambda.
                                 # The real cost is L_I (0.098 -> 0.260 at 1.0, §7.12), so
                                 # WATCH invariance/residual_diagonal: above ~0.15 at step 200,
                                 # or rising after it settles, halve this. Never compensate
                                 # with good_loss.margin_steps.
                                 # --set losses.lambda_good=0.0 restores the inert term, which
                                 # still logs its diagnostics.
                                 # A loss-set change invalidates the checkpoint: train FRESH,
                                 # never resume step750.
  nce_temperature: 1.0           # tmd.py:92 uses sqrt(512)=22.6; we diverge (bug B10a, §7.2).
                                 # float, not a boolean - raise it if logit_std blows up
  action_invariance:
    mode: diagonal               # diagonal (TMD, tmd.py:100-105) | grid_within_question | grid_batch
                                 # the grid modes exist only to reproduce §16.3's failure and they
                                 # BREAK L_step (§7.6.5). grid_max_actions is hardcoded to 64 there.
  step_loss:
    margin_steps: 2.0            # m = margin_steps * (-log discount) = 1.38629 at 0.5. SCALE-FREE.
                                 #   good step  Delta ~ -0.693  (set by L_T, not by m)
                                 #   error step Delta_{z+1} >= 1.386 (set by m)
                                 #   natural eval tau = midpoint ~ 0.347
    pairing: boundary            # boundary (psi_z vs psi_{z+1}) | position_corrected | same_index
                                 # z is 0-BASED (§6.1). The last two are §7.10 expansions, OFF.
                                 # position_corrected needs margin_steps 2.0 -> 3.0 (§7.10).
    exclude_recovery: false       # the 1.48% False->True trajectories (§16.15)
  good_loss:                     # (6) L_good internals - §7.12
    margin_steps: 1.0            # c = -margin_steps * (-log discount) = -0.69315 at 0.5.
                                 # **NEGATIVE**, and that is the whole point: c is the TARGET
                                 # a good step's Delta must not exceed, the same -log gamma
                                 # (3) L_T prices a step at. Not a slack allowance.
                                 # The wrong sign (c = +0.693) trains good steps one step
                                 # AWAY from the goal per step and CONVERGES CLEANLY - no
                                 # curve would show it. config.py rejects margin_steps <= 0
                                 # so the negation happens in exactly one place.
    form: relu                   # relu | softplus.  USE RELU.
                                 # Delta >= -0.693 is a hard floor implied by L_I + L_T, so
                                 # pushing past it costs one of them. softplus applies half
                                 # its gradient AT the target and never reaches zero:
                                 #   base      P(D>tau) 0.229  ruler 1.201  -B -0.97  D +0.240
                                 #   softplus  P(D>tau) 0.000  ruler 1.283  -B -1.42  D -1.556
                                 #   relu      P(D>tau) 0.000  ruler 1.222  -B -0.95  D -0.834
                                 # SIMULATED ON FREE LATENTS (§7.12), same seed and data.
                                 # softplus overshoots the ruler by 2.2 steps and breaks L_T.
    include_incorrect_prefix: true   # also train i <= z of INCORRECT trajectories - they are
                                 # on-track states and eval scores them the same way. i = z+1
                                 # is L_step's pair and is excluded either way; so is i > z+1,
                                 # where no loss defines what Delta should be.
    warmup_steps: 100            # LINEAR ramp on lambda_good over the first 100 optimizer
                                 # steps (~7% of a 1,464-step run). 0 = full weight from step 1.
                                 # relu is why this exists: every other term tapers near its
                                 # target, relu applies FULL gradient the whole time it is
                                 # violated and then stops dead. So L_good would hit at full
                                 # strength from step 1 -- during exactly the ~100 steps when
                                 # L_I has not closed the psi/phi gap and L_T is still on the
                                 # LINEX LINEAR branch, i.e. when the ruler that `c` is
                                 # expressed in DOES NOT EXIST YET.
                                 # The measured cost of L_good is paid by L_I (0.098 -> 0.260
                                 # at lambda 1.0, §7.12) and the first 100 steps are when L_I
                                 # is largest. Ramps the weight, never the term: every good/*
                                 # diagnostic stays unscaled. good/lambda_effective logs it.
    detach_goal: false           # §16.17 in reverse: L_good pulls d(psi_i, g) DOWN, and with
                                 # g attached the cheapest route is to drag the correct
                                 # terminals onto the trajectory - the very vectors phase 2's
                                 # goal head must predict. Watch diagnostic #5; if `within`
                                 # grows while the §10.1 gate worsens, set this true.
  backup:
    clip_t_gain: 20.0            # t = log(clip_t_gain / discount).  §7.4.3
                                 # t bounds an EXPONENT, not a step count: it caps the LINEX
                                 # term at gamma*exp(t) = clip_t_gain, so the steepest gradient
                                 # the backup can put on Dist is clip_t_gain - 1.
                                 # 20.0 reproduces TMD's bare t=3.0 (tmd.py:363) at TMD's OWN
                                 # discount 0.99 (0.99*e^3 = 19.9) -> t = 3.689 at 0.5, 3.352
                                 # at 0.7.  The old `clip_t_steps: 28.5` was anchored at
                                 # gamma=0.9, which TMD never runs, and gave t=19.75 at 0.5:
                                 # exp(19.75) = 3.8e8, no guard at all. That is the 8760.29
                                 # backup at step 0. DO NOT reintroduce a step-count form.
    diag_backup: 0.5             # tmd.py:364. weight on MATCHED (source, its own goal) pairs
    goal_scope_ratio: 1.0        # OURS, no TMD counterpart. within the non-matched mass:
                                 # 1.0 = whole batch (TMD-faithful) | 0.0 = same-question only
                                 # BOTH terms are logged regardless - diagnostic #13, §7.4.2
    stopgrad_psi_backup: false   # tmd.py:365. stops psi(g) inside Dist ONLY (tmd.py:111-112);
                                 # Next is stop-gradded unconditionally either way (tmd.py:113)
  stopgrad_phi_invariance: false # tmd.py:366

train:
  epochs: 1
  grad_accum: 2                  # -> ~1,460 optimizer steps at n_questions 34650, measured
                                 # rate. ASSERTED at launch (§11.1).
                                 # If GPU time is short cut n_questions, NEVER raise this alone.
  lr_backbone: 9.0e-6
  lr_heads: 3.0e-4               # fresh head params only
  schedule: cosine
  warmup_ratio: 0.03
  betas: [0.9, 0.95]
  weight_decay: 0.0
  bf16: true
  grad_clip: 1.0                 # TMD has none (bare optax.adam, tmd.py:341) and needs none:
                                 # no backbone under its heads. We clip because the same
                                 # gradient reaches LoRA inside a 1.5B model and L_T is an
                                 # exp(). The PRE-clip norm is logged as train/grad_norm every
                                 # optimizer step: if it sits far above 1.0 all run, the clip
                                 # has become an LR rescale rather than a guard - raise it.
  log_every: 10
  save_every: 250
  max_steps: null                # dev/smoke override
                                 # optimizer is torch AdamW with foreach=False, hardcoded:
                                 # FusedAdam JIT-compiles against the system CUDA (bug B8) and
                                 # the foreach path allocates a large fp32 transient (bug B9).

goal_head:                       # ================= PHASE 2 (§7.7) =================
  lr: 1.0e-3
  epochs: 20
  batch_size: 512
  max_terminals_per_question: 8

eval:
  subsets: [gsm8k, math, olympiadbench, omnimath]
  max_len: 2048                  # olympiadbench/omnimath run 8-9 steps on long problems;
                                 # the truncation count is logged and >1% is a hard failure
  batch_sequences: 16
  skyline: true                  # labelled skyline only, never a reported result (§5.1, §9.5)

log:
  wandb: true                    # JSONL + console are still the source of truth (§8 of SETUP.md).
                                 # `pip install wandb && wandb login` first: a missing package
                                 # only warns on stderr and trains on regardless.
  wandb_project: feynman-prm
