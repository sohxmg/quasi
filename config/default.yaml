# Feynman-PRM phase-1 config.
#
# Strict-parsed (feynman_prm/config.py): an unknown or misspelled key is a HARD ERROR,
# because "config value silently ignored, library default used" is old bug B4.
#
# Every TMD-derived number carries its provenance. Where CLAUDE.md and the TMD repo
# disagree, the repo wins unless §7 states an explicit reasoned divergence.
#
# NOT config, because they must never vary (PLAN "Config"): fp32 distances (mandatory,
# bug B10a), pad-to-batch-max, the separator-after-prompt, strip_step_prefix,
# log_selection_sha, add_step_prefix at eval, report_math_leak_split, layer_norm on the
# psi/phi hidden layers, and hidden_size (always read from the downloaded config.json).

run:
  # ONE DIRECTORY PER LOSS-SET CHANGE. `runs/<name>/` holds step*/ , final/ , phase2/ ,
  # metrics.jsonl, events.jsonl and config.resolved.yaml, and train.py writes into it without
  # asking -- so reusing a name silently overwrites the checkpoint the last set of numbers
  # came from. `runs/phase1/` is the lambda_good=1 run whose §9.3.1 F1 0.241 / §9.7 rank
  # tables are the current baseline; do not point a new run at it.
  name: phase1_cf_term          # THE FIRST RUN IN WHICH (4) L_CF AND (7) L_term BOTH ENTER A
                                # GRADIENT. 2026-08-15. lambda_cf 0.0 -> 1.0 and
                                # lambda_term 0.0 -> 1.0.
                                #
                                # TWO CHANGES, AND THAT IS A KNOWN CONFOUND CHOSEN ON PURPOSE.
                                # The human was offered the sequenced pair (phase1_cf, then
                                # phase1_cf_term, one change each) and chose the bundle for the
                                # faster signal. So §16.27's complaint about the 2026-08-04 run
                                # applies to this one too and is NOT an oversight: a move in F1
                                # or gate/recall_at_1 CANNOT be assigned to (4) or (7) from this
                                # run alone. The two separating re-runs are in scripts/train.sh
                                # and each is one line; budget for one of them.
                                #
                                # Everything else is runs/phase1_nce_temp_relu2's shipped config
                                # -- tau_NCE = sqrt(512), L_good relu_squared,
                                # nce_mask_nearer_same_traj = true (2026-08-04).
                                # NOTE that run was launched with `--set losses.zeta=0.1`, which
                                # is NOT in this file; zeta is 0.05 here, TMD-faithful. Pass the
                                # same override or the bundle is THREE changes, not two -- do
                                # not assume the baseline's directory matches this file.
  out_dir: runs
  seed: 42

model:
  name: Qwen/Qwen2.5-Math-1.5B-Instruct
  lora:
    r: 16
    alpha: 16
    dropout: 0.0                 # 7 Qwen2 attn+MLP projections. NEVER a head. §6.2, §14
  gradient_checkpointing: true
  attn_implementation: sdpa      # already a fused flash-family kernel. flash_attention_2 is
                                 # selectable IF a cp312/cu128/sm_120 wheel ever installs -
                                 # worth ~2% of FLOPs, not the lever (PLAN 4a). NO flash-attn dep.

heads:
  latent_dim: 512                # tmd get_config(). NOT 1536 -> that was ~80% symmetric (old R6)
  hidden_dims: [512, 512, 512]   # networks.py:531-542
  ensemble: false                # TMD uses 2 + min(); off per human call. §16.6
  action_pool: mean              # mean | attention   (§6.4, §16.7)

distance:
  variant: full_mrn              # full_mrn | asym_only | iqe   (tmd.py:28-66)
  components: 8                  # K, tmd get_config()

data:
  dir: data/processed
  max_len: 1024                  # rows over this are DROPPED, never truncated (~0.05%, logged)
  sep_token: "\n"                # asserted to be exactly one token id at load (§6.1)
  prompt_format: raw             # raw (CRM-faithful) | chat (Qwen chat template)
  n_questions: 34650             # x 4.33 seqs/question = ~150k seqs/epoch (NOT 9.18 - §11.1)
                                 # RAISED 23000 -> 34650 on 2026-07-28, with the L_good run.
                                 # 34650 x 4.33 = 150,035 sequences -> ~1,460 optimizer steps
                                 # measured-rate (~1,340 analytic; the token cap makes real
                                 # batches ~51 seqs, not 56 - §8.1.2).
                                 # THE POOL IS ~38,247 (40,247 trainable minus the 2,000 val
                                 # holdout), so this takes 91% of it. There is no room for a
                                 # third increase: past ~38k the only lever is train.epochs.
                                 # CHANGING THIS CHANGES THE SELECTION SHA -> re-run
                                 # scripts/prepare_data.py before training, or the parquet
                                 # still holds the 23,000-question selection. The VAL split is
                                 # unaffected (it is drawn before n_questions is applied), so
                                 # val_f1 numbers stay comparable across the change.
  n_val_questions: 2000

  # ============ (4) L_CF's data, attached to the MAIN batch (§7.5.3 option (b)) ============
  # CHOSEN BY THE HUMAN 2026-08-15 over §7.5.3's separate interleaved loader. `phi_i =
  # phi(h_{i-1}, act_emb_i)` and rewriting step i leaves h_{i-1} untouched, so a CF example
  # whose prefix is already forwarded in this batch costs an embedding lookup plus an MLP --
  # NO LM forward. The interleaved loader pays one prefix forward per CF example instead.
  #
  # MEASURED 2026-08-15 (offline, no GPU): 27,114 examples over 8,639 questions, ALL inside
  # the 34,650-question train selection, 0 in the val holdout, 0 duplicate (question,
  # step_index) -- and 24,911 of 27,114 prefixes (91.9%) are reachable from the capped train
  # trajectories. THAT is the level `cf/attach_rate` should sit near over an epoch; far
  # below it means the join is broken, not that the data is thin. (The cap arithmetic alone
  # predicts 85.6%; the extra 6.3 points are CF examples riding a SIBLING trajectory that
  # shares the first i steps, which is why the key is the prefix and not the trajectory.)
  #
  # A miss is DROPPED and counted (`cf/examples_attached` vs `cf/examples_eligible`), never
  # backfilled: a backfill is a prefix forward inside the main step, which is the cost this
  # option exists to avoid.
  #
  # "" disables the path entirely and (4) stays an exact zero. NOTE the campaigns' floors
  # differ on disk as of 2026-08-15 -- gemini was regenerated at 1/3, bharatcode and openai
  # are still at 2/5 (§7.5.2) -- so this list mixes two validator settings.
  #
  # THE THREE FILES ARE LISTED, NOT GLOBBED. `data/cf/cf70k*.jsonl` matches SIXTEEN files:
  # each campaign writes `.raw`, `.rejected`, `.discarded` and `.responses` beside the kept
  # examples, and those have different schemas. Comma-separated; each part must match at
  # least one file or the launch fails.
  #
  # THEY NOW LIVE IN `data/cf_train/`, WHICH IS A SNAPSHOT, NOT THE CAMPAIGN DIRECTORY
  # (2026-08-15). `data/cf/` is 426 MB of campaign artifacts of which 52 MB are kept
  # examples; the training box only ever needs the 52 MB, so the three kept files are
  # copied into `data/cf_train/` and that is the only data directory that ships. The
  # copies are a SNAPSHOT: a campaign that keeps generating grows `data/cf/*.jsonl` and
  # NOT these, so re-copy (and re-rsync) before a run that is meant to see new examples.
  # `data/cf/` is untouched -- `cf_exclude_generated.py` globs `data/cf/*responses.jsonl`
  # and must keep finding them, or the next campaign regenerates anchors already paid for.
  cf_glob: "data/cf_train/cf70k.jsonl,data/cf_train/cf70k_gm.jsonl,data/cf_train/cf70k_oai.jsonl"
  cf_max_per_batch: 12           # ~9.3/batch covers 27,114 over ~2,920 micro-batches in one
                                 # epoch; 12 leaves headroom for the uneven ones. The cap is
                                 # what keeps L_CF's magnitude and the per-step cost flat on
                                 # a batch that happens to hold many CF-covered questions.

# ===================== THE ONE DISCOUNT (locked #9) =====================
# Read in TWO places and it is the SAME number in both, exactly as in TMD:
#   1. goal sampler  - datasets.py:263  how far ahead training goals are drawn
#   2. backup gamma  - tmd.py:110       per-good-step cost = -log(discount)
# Pick it on GOAL VARIETY alone (§4.5). Do NOT reintroduce a second key (§7.8).
discount: 0.5                    # CHOSEN 2026-07-25. -log = 0.69315, 41.1% endings, 4.19 distinct
                                 # 0.7 = sanctioned fallback (-log 0.35667, 55.0%, 3.45 distinct)
                                 # NOT TMD's 0.99: 1.16 distinct goals = old root cause B

sampling:
  sequences_per_micro_batch: 56
  max_padded_tokens: 32768       # THE SECOND BUDGET. A batch closes when it would break
                                 # either this or the sequence count, because a batch costs
                                 # len(batch) x max_len on the GPU, not len(batch).
                                 # MEASURED 2026-07-27 (scripts/batch_report.py), after the
                                 # PLAN 4a probe OOMed at 57,344 tok on a 15.46 GiB card:
                                 #   lengths p50 248, p90 514, 0.7% above 896 -> the median
                                 #   batch is 19,423 tok and the worst is 57,344, so only
                                 #   17% of batches are over this cap.
                                 # 32768 costs 5% of L_NCE's mean pool (R 364 -> 344) and
                                 # NOTHING at p10 (177 -> 176): thin pools live on SHORT
                                 # batches, oversized batches carry the LARGEST pools.
                                 # Cutting sequences_per_micro_batch instead shrinks every
                                 # batch: 28 seqs halves R to 175 and Q to 6.0. Do that only
                                 # if the cap alone cannot fit the card.
                                 # ~11.5 GiB peak, 1943 batches, 971 steps, grad_accum stays 2.
                                 # 40960 measures ~13.4 GiB - inside the error bar. Re-run
                                 # batch_report.py before raising it.
  max_correct_per_question: 4    # CAPS, not quotas: min(cap, available). median is 2. §4.2.1
  max_incorrect_per_question: 3
  nce_mask_same_traj: false      # locked #12 - we want the negatives. THE BLUNT SWITCH: it
                                 # also drops the rows EARLIER than the positive, which are
                                 # honest hard negatives and the only within-solution gradient
                                 # there is. Stays false; the surgical one is below.
  nce_mask_nearer_same_traj: true   # §16.4 / §9.9.2, ON since 2026-08-04.
                                 # Goal at s_6 with the sampled positive phi_3: rows phi_4,
                                 # phi_5, phi_6 are on that SAME trajectory and are all NEARER
                                 # the goal -- phi_6 lands ON it -- and cross_entropy marks
                                 # every one of them wrong. §16.4 wrote this down on
                                 # 2026-07-24 and it sat open for 11 days while §9.8.5
                                 # asserted the opposite ("the backward direction is correct
                                 # here"); that sentence is withdrawn (§9.9.2).
                                 # Measured on the sampler: 41.8% of columns carry at least
                                 # one, 0.64 rows per column, and they are the CLOSEST rows in
                                 # the pool -- so their share of the softmax MASS is far above
                                 # their 0.2% share of the count.
                                 # It also dissolves the duplicate-column contradiction for
                                 # free: probe01/distinct_goal_ratio has read 0.704 for 150
                                 # logged steps, i.e. 29.6% of goal columns are byte-identical
                                 # to another column with a DIFFERENT positive, asserting
                                 # opposite orderings of the same pair (§9.9.3).
                                 # Rows EARLIER than the positive are KEPT.
                                 # PRE-FLIGHT: nce/argmax_in_nearer_set is computed on the RAW
                                 # logits with every mask off, so it reads on this run too.
                                 # High => the mask is aimed right. ~0 => the softmax mass is
                                 # elsewhere and this will be inert; find out where (§9.9.6).
                                 # JUDGE ON within_question_terminal_spread and
                                 # probe02/delta_good_mean (now -0.32, target -0.693), not F1.
  nce_mask_sibling_correct_late: false  # §16.25(a)/§9.9.5, the OTHER half of the false
                                 # negatives: late states of a SIBLING CORRECT trajectory
                                 # against TERMINAL goal columns. Left OFF deliberately --
                                 # §9.9.7's order of work runs the nearer mask FIRST and
                                 # judges it alone, and this run already carries two other
                                 # changes (tau_NCE and relu_squared).
  nce_mask_same_question_correct: false # the blunt comparator for the line above (~15 of
                                 # ~347). Over-broad by §16.25(a)'s own admission.
  group_by_length: true          # ~60% -> ~10% padding, est. 4h -> 2h/epoch. Peak mem 9->12 GB,
                                 # so the longest batch runs FIRST as a probe. false = spec order.
                                 # Q stays ~12.9 and every §8.1.1 count holds either way (PLAN 4a).

losses:
  lambda_nce: 1.0                # (1) L_NCE   §7.2
  lambda_i: 1.0                  # (2) L_I     §7.3  TMD puts invariance at 1.0, NOT under zeta
  zeta: 0.05                     # (3) L_T     §7.4  weights the BACKUP ONLY - tmd.py:124
  lambda_cf: 1.0                 # (4) L_CF    §7.5  RAISED FROM 0.0 ON 2026-08-15. Locked #4's
                                 # two gates are both cleared: 27,114 examples are on disk
                                 # (§7.5.2) and the main-batch attach path is wired (§7.5.13),
                                 # so this is the last line that was holding (4) inert.
                                 # 1.0 because that is what EVERY other spec term in the set
                                 # carries (lambda_nce, lambda_i, lambda_step, lambda_good) and
                                 # there is nothing to prefer over parity: NOTHING ABOUT THIS
                                 # WEIGHT IS MEASURED and §17 has no row for it. Same standing
                                 # as §16.8's "every loss weight is unvalidated" -- it is a
                                 # starting point, not a result.
                                 # tau STAYS 1.0 on (4) and is a plain function argument, not a
                                 # config key (§7.5.13): sqrt(512) has provenance for (1) only,
                                 # and at tau = 22.6 the ~8-candidate denominator is flat enough
                                 # that the weight is an off switch. tau and lambda are the same
                                 # knob here (gradient ~ lambda/tau), so moving both in one
                                 # change would bundle two effects -- which is what §9.10 is on
                                 # record for having cost.
                                 # THIS IS THE ONLY LOSS-SET CHANGE IN THIS RUN. Read it against
                                 # runs/phase1_nce_temp_relu2 and nothing else.
                                 # --set losses.lambda_cf=0.0 is the one-line revert; the term
                                 # is then skipped in total.py and the total is bit-identical to
                                 # the previous run's, with the full cf/* key set still logged.
                                 # WATCH cf/attach_rate -- it must sit near 0.916 over the epoch
                                 # (§7.5.13). Far below means the join is broken, and the most
                                 # likely cause is a sequences.parquet written before
                                 # 2026-08-15: no prefix_hash column -> every state hashes to 0
                                 # -> nothing attaches -> lambda_cf > 0 trains NOTHING while
                                 # every other log line looks healthy. Re-run prepare_data.py.
  lambda_step: 1.0               # (5) L_step  §7.6  carries correctness. not optional (§7.6.2)
  lambda_good: 1.0               # (6) L_good  §7.12 THE FALSE-POSITIVE TERM. ON since
                                 # 2026-07-28 - the §16.21 sign-off, given by the human after
                                 # the step-750 measurement below. It shipped at 0.0 for
                                 # exactly one day.
                                 # Nothing else in the loss set bounds a good step's Delta
                                 # from ABOVE: at L_I's optimum the MRN forces
                                 # d(phi_i,g) >= d(psi_{i-1},g), so the -A term of
                                 #   Delta_i = -0.693 - A_i - B_i
                                 # is >= 0 with no ceiling. Measured at step 750: good-step
                                 # Delta mean +0.240, P(Delta > 0.347) = 0.34, fitted tau
                                 # driven to 2.39, F1 capped at 0.456 (§7.12).
                                 # 1.0 is UNVALIDATED like every other weight (§16.8). The
                                 # weak claim is that it does not drown L_step (~660 terms vs
                                 # ~67 pairs) -- MEASURED SMALL: probe03/gap RISES with lambda.
                                 # The real cost is L_I (0.098 -> 0.260 at 1.0, §7.12), so
                                 # WATCH invariance/residual_diagonal: above ~0.15 at step 200,
                                 # or rising after it settles, halve this. Never compensate
                                 # with good_loss.margin_steps.
                                 # --set losses.lambda_good=0.0 restores the inert term, which
                                 # still logs its diagnostics.
                                 # A loss-set change invalidates the checkpoint: train FRESH,
                                 # never resume step750.
  lambda_term: 1.0               # (7) L_term  §7.13 / §16.26. THE "PULL TWO CORRECT TERMINALS
                                 # OF ONE QUESTION TOGETHER" TERM.
                                 # RAISED 0.0 -> 1.0 ON 2026-08-15 BY THE HUMAN, who was shown
                                 # §16.26's order of work and §7.13.1's shortcut and asked for
                                 # it on anyway. That is the decision; what follows is what it
                                 # obliges the run to do, NOT an argument against it.
                                 # It is (4) L_CF's loss re-grouped by QUESTION instead of by
                                 # CF example - same function, no fork, no mode flag - so
                                 # §7.5.1's two REQUIREMENT properties hold unchanged.
                                 # ZERO EXTRA LM FORWARDS - traj_qid / traj_correct /
                                 # traj_terminal are already in every batch (§7.13). The cost
                                 # is a ~50x7 distance against Dist's ~348x172.
                                 # 1.0 for the same reason lambda_cf is: parity with every
                                 # other spec term, and NOTHING about it is measured (§16.8).
                                 #
                                 # WHAT §16.26 SAYS AND WHY IT IS NOT A BLOCKER. Its order of
                                 # work puts the §9.9 NCE masks first because they are free and
                                 # unambiguously correct. nce_mask_nearer_same_traj IS already
                                 # on (2026-08-04) -- but §9.10.3 records that tau_NCE = sqrt(512)
                                 # mutes L_NCE 22.6x and mutes that repair with it, so the mask
                                 # has NOT had its clean test. Turning (7) on before that test
                                 # is a deliberate reordering, not a completed prerequisite.
                                 #
                                 # THE RUN MUST SEPARATE TWO EXPLANATIONS (§7.13.1, §16.26).
                                 # Every correct solution of a question prints the same answer
                                 # and incorrect siblings essentially never do (answer_match_auc
                                 # 0.927 against a chance of 0.500; n = 0.001), so (7) can be
                                 # solved by clustering on the final NUMBER -- which transfers to
                                 # nothing, because a PRM scores UNFINISHED solutions. So a run
                                 # that improves gate/recall_at_1 has TWO explanations and the
                                 # improvement alone does not choose between them. The separator
                                 # is post-hoc and costs no training time:
                                 #   python scripts/goal_gate.py --checkpoint runs/<run>/final
                                 #   python scripts/goal_gate.py --checkpoint runs/<run>/final \
                                 #          --mask-answer
                                 # Recall that survives masking is structure; recall that
                                 # collapses under it was the printed string. REPORT BOTH.
                                 # THE TERM IS A HYPOTHESIS, NOT A FIX -- an unseparated
                                 # improvement does not promote it to one.
                                 #
                                 # Computed and logged at every weight, like lambda_good, so
                                 # --set losses.lambda_term=0.0 is an exact revert that still
                                 # logs every term/* diagnostic.
                                 # WATCH term/loss against term/chance, which is NOT a constant
                                 # (it moves with the batch's ragged caps), and
                                 # term/within_question_terminal_spread, which is the statistic
                                 # §16.26 says this term exists to move: 2.905 at the §9.8.3
                                 # measurement, and it should FALL.
                                 # term/questions_skipped_single_correct is ~31% of questions by
                                 # construction (10,899 of 34,650 have <2 correct, §7.13) -- that
                                 # is the level to read it against, NOT zero.
  lambda_term_temperature: 1.0   # (7)'s tau. §7.13 requires whoever raises lambda_term to PICK
                                 # this in the same change rather than inherit an unexamined
                                 # default, so it is a config key as of 2026-08-15 instead of a
                                 # function argument nobody had to look at.
                                 # 1.0, and the arithmetic is the §7.5.13 argument on a SMALLER
                                 # denominator. (7)'s softmax has c_q - 1 + w_q candidates,
                                 # which is ~4.9 at the §8.1 caps (mean 2.66 correct, 2.24
                                 # incorrect) against (4)'s ~8. §9.10.1 measured distance-space
                                 # spread at 0.31 -> 0.76; at tau = sqrt(512) that is a logit
                                 # spread of ~0.034 over ~5 candidates, i.e. a flat softmax
                                 # pinned at log(c-1+w). sqrt(512) is not a temperature here, it
                                 # is an off switch, and it has provenance for (1) ONLY.
                                 # tau and lambda are the same knob (gradient ~ lambda/tau), so
                                 # whoever moves this is moving lambda_term by the reciprocal.
  lambda_cf_temperature: 0.1     # (4)'s tau. A CONFIG KEY as of 2026-08-18, and before that
                                 # it was not a key OR an argument: total.py called
                                 # counterfactual_loss with no temperature= at all, so the
                                 # 2026-08-15 run raised lambda_cf 0.0 -> 1.0 against an
                                 # INHERITED 1.0 default -- exactly the "a default nobody has
                                 # to type is what unexamined means" failure §7.13 wrote the
                                 # rule for. The comment above lambda_cf claiming "tau STAYS
                                 # 1.0 on (4) and is a plain function argument" described an
                                 # argument that was never passed; it is withdrawn.
                                 #
                                 # 0.1, NOT 1.0, and the arithmetic is §7.5.14's. (4) operates
                                 # at a DISTANCE SPREAD of ~0.06 -- measured at step ~1090 of
                                 # wc5byua1: cf/positive_distance 0.056 against
                                 # cf/negative_distance 0.119. At tau = 1.0 that is a logit
                                 # spread of 0.06 over a ~9-candidate softmax, i.e. FLAT to
                                 # three decimals, and cf/loss - log(P+N) flatlined at -0.02
                                 # for the whole run. tau = 0.1 puts p_pos ~ 0.5-0.65 across
                                 # the plausible spread range 0.06-0.25. 0.05 was rejected: it
                                 # saturates (p_pos -> 1, loss -> -log(1) territory) if the
                                 # separation keeps growing, and a saturated softmax has no
                                 # gradient left.
                                 # THE TELL IS cf/loss - cf/chance, never raw cf/loss. If it
                                 # runs to -1.09 or beyond, tau overshot and 0.2 is the
                                 # fallback; if it stays near -0.02, this change did nothing.
                                 # tau and lambda are the same knob (gradient ~ lambda/tau), so
                                 # whoever moves this is moving lambda_cf by the reciprocal.
  nce_temperature: 22.627417     # sqrt(latent_dim) = sqrt(512). **TMD's own scaling**
                                 # (tmd.py:92: `logits = -dist / sqrt(phi.shape[-1])`),
                                 # adopted 2026-08-04. Reverses §7.2's documented divergence,
                                 # which shipped 1.0 for every run to date.
                                 # WHAT IT DOES: distances of O(1-10) become logits of
                                 # O(0.05-0.5), so the softmax is much flatter and L_NCE's
                                 # gradient on the distances is 22.6x smaller. That is a
                                 # REWEIGHTING of (1) against (2)/(3)/(5)/(6) as much as it is
                                 # a temperature.
                                 # THE RISK, and it is written down in §7.2/§14: a flat softmax
                                 # is also the signature of bug B10a. B10a itself cannot
                                 # recur -- distances are fp32 (§6.3), so the logit
                                 # DIFFERENCES do not round to equal -- but the diagnostic
                                 # that catches it now reads 22.6x smaller.
                                 # SO READ logit_std x temperature, NOT logit_std: the
                                 # scale-free quantity is the spread in DISTANCE space.
                                 # tests/test_gpu.py's B10a guard was made scale-aware for
                                 # exactly this (the B12 lesson: never a constant offset on a
                                 # quantity whose scale is set elsewhere).
                                 # If nce/loss now sits pinned at log(R) with pos ~= neg,
                                 # this is why -- revert to 1.0, do not raise lambda_nce.
  action_invariance:
    mode: diagonal               # diagonal (TMD, tmd.py:100-105) | grid_within_question | grid_batch
                                 # the grid modes exist only to reproduce §16.3's failure and they
                                 # BREAK L_step (§7.6.5). grid_max_actions is hardcoded to 64 there.
  step_loss:
    margin_steps: 2.0            # m = margin_steps * (-log discount) = 1.38629 at 0.5. SCALE-FREE.
                                 #   good step  Delta ~ -0.693  (set by L_T, not by m)
                                 #   error step Delta_{z+1} >= 1.386 (set by m)
                                 #   natural eval tau = midpoint ~ 0.347
    pairing: boundary            # boundary (psi_z vs psi_{z+1}) | position_corrected | same_index
                                 # z is 0-BASED (§6.1). The last two are §7.10 expansions, OFF.
                                 # position_corrected needs margin_steps 2.0 -> 3.0 (§7.10).
    exclude_recovery: false       # the 1.48% False->True trajectories (§16.15)
  good_loss:                     # (6) L_good internals - §7.12
    margin_steps: 1.0            # c = -margin_steps * (-log discount) = -0.69315 at 0.5.
                                 # **NEGATIVE**, and that is the whole point: c is the TARGET
                                 # a good step's Delta must not exceed, the same -log gamma
                                 # (3) L_T prices a step at. Not a slack allowance.
                                 # The wrong sign (c = +0.693) trains good steps one step
                                 # AWAY from the goal per step and CONVERGES CLEANLY - no
                                 # curve would show it. config.py rejects margin_steps <= 0
                                 # so the negation happens in exactly one place.
    form: relu_squared           # relu | relu_squared | softplus.  NEVER SOFTPLUS.
                                 # Delta >= -0.693 is a hard floor implied by L_I + L_T, so
                                 # pushing past it costs one of them. softplus applies half
                                 # its gradient AT the target and never reaches zero:
                                 #   base      P(D>tau) 0.229  ruler 1.201  -B -0.97  D +0.240
                                 #   softplus  P(D>tau) 0.000  ruler 1.283  -B -1.42  D -1.556
                                 #   relu      P(D>tau) 0.000  ruler 1.222  -B -0.95  D -0.834
                                 # SIMULATED ON FREE LATENTS (§7.12), same seed and data.
                                 # softplus overshoots the ruler by 2.2 steps and breaks L_T.
                                 #
                                 # relu_squared SHIPPED 2026-08-04, and it is a response to a
                                 # MEASURED failure of relu on the model. `mean relu(Delta-c)`
                                 # is indifferent between many small violations and one large
                                 # one, so the bulk moved and the tail did not:
                                 #   Delta mean          +0.392 -> -0.412   (the sign flip)
                                 #   frac_above_natural   0.070 ->  0.16    REGRESSED
                                 #   p99                   0.86 ->  2.43
                                 #   good/delta_max                 7.58
                                 # (§7.12's mid-run block, run jjkad2ae.) The square makes the
                                 # gradient 2*excess instead of 1, so a violator is priced by
                                 # how far out it is; it keeps relu's two load-bearing
                                 # properties -- exactly 0 below c, exactly 0 gradient AT c.
                                 # NOT MEASURED at this form anywhere: there is no
                                 # relu_squared row in §7.12's table, on the model or in
                                 # simulation. Judge it on probe14's frac_above_natural and
                                 # p99, and watch invariance/residual_diagonal HARDER than at
                                 # relu -- L_good's cost lands on L_I, and this form can put
                                 # ~68 on a single term where relu put 8.3.
                                 # --set losses.good_loss.form=relu is the one-line revert.
    include_incorrect_prefix: true   # also train i <= z of INCORRECT trajectories - they are
                                 # on-track states and eval scores them the same way. i = z+1
                                 # is L_step's pair and is excluded either way; so is i > z+1,
                                 # where no loss defines what Delta should be.
    warmup_steps: 100            # LINEAR ramp on lambda_good over the first 100 optimizer
                                 # steps (~7% of a 1,464-step run). 0 = full weight from step 1.
                                 # relu is why this exists: every other term tapers near its
                                 # target, relu applies FULL gradient the whole time it is
                                 # violated and then stops dead. So L_good would hit at full
                                 # strength from step 1 -- during exactly the ~100 steps when
                                 # L_I has not closed the psi/phi gap and L_T is still on the
                                 # LINEX LINEAR branch, i.e. when the ruler that `c` is
                                 # expressed in DOES NOT EXIST YET.
                                 # The measured cost of L_good is paid by L_I (0.098 -> 0.260
                                 # at lambda 1.0, §7.12) and the first 100 steps are when L_I
                                 # is largest. Ramps the weight, never the term: every good/*
                                 # diagnostic stays unscaled. good/lambda_effective logs it.
    detach_goal: false           # §16.17 in reverse: L_good pulls d(psi_i, g) DOWN, and with
                                 # g attached the cheapest route is to drag the correct
                                 # terminals onto the trajectory - the very vectors phase 2's
                                 # goal head must predict. Watch diagnostic #5; if `within`
                                 # grows while the §10.1 gate worsens, set this true.
  backup:
    clip_t_gain: 20.0            # t = log(clip_t_gain / discount).  §7.4.3
                                 # t bounds an EXPONENT, not a step count: it caps the LINEX
                                 # term at gamma*exp(t) = clip_t_gain, so the steepest gradient
                                 # the backup can put on Dist is clip_t_gain - 1.
                                 # 20.0 reproduces TMD's bare t=3.0 (tmd.py:363) at TMD's OWN
                                 # discount 0.99 (0.99*e^3 = 19.9) -> t = 3.689 at 0.5, 3.352
                                 # at 0.7.  The old `clip_t_steps: 28.5` was anchored at
                                 # gamma=0.9, which TMD never runs, and gave t=19.75 at 0.5:
                                 # exp(19.75) = 3.8e8, no guard at all. That is the 8760.29
                                 # backup at step 0. DO NOT reintroduce a step-count form.
    diag_backup: 0.5             # tmd.py:364. weight on MATCHED (source, its own goal) pairs
    goal_scope_ratio: 1.0        # OURS, no TMD counterpart. within the non-matched mass:
                                 # 1.0 = whole batch (TMD-faithful) | 0.0 = same-question only
                                 # BOTH terms are logged regardless - diagnostic #13, §7.4.2
    stopgrad_psi_backup: false   # tmd.py:365. stops psi(g) inside Dist ONLY (tmd.py:111-112);
                                 # Next is stop-gradded unconditionally either way (tmd.py:113)
  stopgrad_phi_invariance: false # tmd.py:366

train:
  epochs: 1
  grad_accum: 2                  # -> ~1,460 optimizer steps at n_questions 34650, measured
                                 # rate. ASSERTED at launch (§11.1).
                                 # If GPU time is short cut n_questions, NEVER raise this alone.
  lr_backbone: 9.0e-6
  lr_heads: 3.0e-4               # fresh head params only
  schedule: cosine
  warmup_ratio: 0.03
  betas: [0.9, 0.95]
  weight_decay: 0.0
  bf16: true
  grad_clip: 1.0                 # TMD has none (bare optax.adam, tmd.py:341) and needs none:
                                 # no backbone under its heads. We clip because the same
                                 # gradient reaches LoRA inside a 1.5B model and L_T is an
                                 # exp(). The PRE-clip norm is logged as train/grad_norm every
                                 # optimizer step: if it sits far above 1.0 all run, the clip
                                 # has become an LR rescale rather than a guard - raise it.
  log_every: 10
  save_every: 250
  max_steps: null                # dev/smoke override
                                 # optimizer is torch AdamW with foreach=False, hardcoded:
                                 # FusedAdam JIT-compiles against the system CUDA (bug B8) and
                                 # the foreach path allocates a large fp32 transient (bug B9).

goal_head:                       # ================= PHASE 2 (§7.7) =================
  lr: 1.0e-3
  epochs: 100                    # RAISED from 20 on 2026-08-04. The 20-epoch fit on
                                 # runs/phase1 ended with goal/loss 7.469 -> 4.491 and STILL
                                 # FALLING, so 20 was a stopping point nobody chose. 186
                                 # batches/epoch at 95,078 terminals and the whole fit took
                                 # ~53 s of the 4,554 s wall clock -- the cache is the cost,
                                 # not the epochs, so 100 is ~4 min and --from-cache makes a
                                 # refit seconds.
                                 # PICK THIS ON goal/val_loss, NOT goal/loss. phase2/val_best
                                 # prints where val bottomed; if it is far below epochs-1,
                                 # lower this key rather than banking the overfit.
                                 # AND SEE §9.7.3 BEFORE SPENDING TIME HERE: the gold
                                 # reference terminal moved localisation by 0.2 sigma against
                                 # the goal head, and a CROSS-QUESTION goal retained 103% of
                                 # the signal (§9.8.1). A better goal head has a measured
                                 # near-zero expected effect on F1. This is a cheap
                                 # correctness fix, not a lever.
  batch_size: 512
  max_terminals_per_question: 8
  val_questions: 2000            # HELD OUT BY QUESTION, added 2026-08-04. Holding out one of
                                 # a question's terminals while training on its siblings leaks
                                 # h_s0 -- eval queries unseen QUESTIONS, so the split has to
                                 # be the same kind. Costs ~6% of the training terminals and
                                 # is a slice on a cached tensor. 0 disables it, and then
                                 # `epochs` has no honest number to be chosen on.

eval:
  subsets: [gsm8k, math, olympiadbench, omnimath]
  max_len: 2048                  # olympiadbench/omnimath run 8-9 steps on long problems;
                                 # the truncation count is logged and >1% is a hard failure
  batch_sequences: 16
  skyline: true                  # labelled skyline only, never a reported result (§5.1, §9.5)

log:
  wandb: true                    # JSONL + console are still the source of truth (§8 of SETUP.md).
                                 # `pip install wandb && wandb login` first: a missing package
                                 # only warns on stderr and trains on regardless.
  wandb_project: feynman-prm
