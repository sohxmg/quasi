# QRL's own knobs, and NOTHING else. Everything shared with Feynman-PRM -- dataset,
# selection, seed, batch stream, tokenisation, backbone, LoRA, optimiser, schedule, CF
# corpus, eval protocol -- comes from `config/default.yaml` UNCHANGED, which is what makes
# the QRL row and the Feynman-PRM rows differ in the objective and nothing else.
#
# Strict-parsed (qrl_prm/config.py): an unknown or misspelled key is a HARD ERROR.
#
#   python -m qrl_prm.train --set run.name=qrl_iqe --set distance.variant=iqe
#   python -m qrl_prm.train --set run.name=qrl_cheap --set qrl.cf_encode_max_tokens=8192
#
# `run.name` and `distance.variant` come through `--set`, so `config/default.yaml` is never
# edited for this run. `qrl_prm/train.sh` supplies both.
#
# NOT `losses.*` in config/default.yaml. Not one key of that block is read by anything in
# qrl_prm/ -- QRL's weights are LEARNED dual variables, not fixed lambdas. train.py refuses
# to start if a `--set losses.*` override is passed, because it would be silently inert.

softplus_offset: 25     # losses/global_push.py:26. "Should be greater than most GT distances
                        # between sampled pairs" -- QRL's own words. Online default 15.
                        #
                        # WENT TO 5 AND CAME BACK, and that round trip is the lesson. The
                        # offset was blamed for loj243n4's runaway on a ratio argument (25 is
                        # ~10x upstream's offset/horizon and offset/mean-pair calibration) and
                        # cut to 5. Wrong: that assumed the offset sets the scale, and it does
                        # not -- init_lagrange_path does. A 120-step A/B at matched lambda
                        # moved the adjacent-step mean only 9.15 -> 6.77 (offset 25 -> 8),
                        # while lambda 0.01 -> 1.5 moved it 9.15 -> 1.40.
                        #
                        # The offset sets the DYNAMIC RANGE for separation instead, and 5 is
                        # too little. At 5 (1wbpyf2g) push_saturated_frac ran 0.09 -> 0.45
                        # between steps 40 and 120, tracking to cross 0.9 by ~step 250 -- the
                        # flat-region failure this file's own note warns about. At 25
                        # (loj243n4) it held 0.12-0.22 for 1,460 steps and cross-question
                        # distances reached 10-16 instead of capping at 6.6.
                        #
                        # Structure agrees: bucketing loj243n4 by lambda, same_traj/cross_q
                        # goes 0.875 (lambda<0.5) -> 0.834 (1.5-2.0) -> 0.810 (2.5-3.0), best
                        # readings 0.63-0.68 at lambda 2.2-3.2, all at offset 25. The offset-5
                        # run reads 0.869 at matched lambda.
                        #
                        # READ `qrl/push_saturated_frac` AT LAUNCH AND AGAIN AT STEP ~300.
                        # Near 1.0 at init means the offset is below the untrained distance
                        # scale (iqe inits at 2.995, full_mrn at 6.723) and the push has no
                        # gradient. RISING through the run means it is too small for the scale
                        # lambda settled on.

softplus_beta: 0.1      # losses/global_push.py:23. Smaller => smoother loss. QRL's default,
                        # unchanged. Note F.softplus's `beta` scales the INPUT and divides
                        # the output: softplus_0.1(x) = 10 * log(1 + exp(0.1 x)).

step_cost: 1.0          # losses/local_constraint.py:29. One observed reasoning step IS the
                        # unit of the metric. `qrl/local_dist_mean` should pin to ~1.0, and
                        # that curve is the direct answer to IMPLEMENTATION.md §9's decaying
                        # ruler: under the fixed-weight losses `backup/delta_mean` drifted
                        # off -log gamma with nothing holding it; here it is a CONSTRAINT
                        # with its own dual variable, not a target a soft loss trades away.
                        #
                        # It is ALSO the slope of the path constraint's target: an observed
                        # gap of k steps is bounded by k * step_cost. k = 1 and k >= 2 are the
                        # same inequality read at different gaps, enforced as two DISJOINT
                        # constraints under two multipliers -- see init_lagrange_local.

epsilon_local: 0.25     # losses/local_constraint.py:22, QRL's default, unchanged. The
                        # tolerance on the k = 1 constraint:
                        #
                        #   E_{j=i+1}[relu(d(s_i, s_j) - step_cost)^2] <= epsilon_local^2
                        #
                        # so the adjacent-step ruler may sit at step_cost + 0.25 = 1.25. This
                        # is what `qrl/local_dist_mean` is read against, and it is upstream's
                        # own number. ONE-SIDED: an adjacent pair the metric already measures
                        # as shorter than one step is free -- the trace need not be the
                        # shortest path between its own endpoints. The push term is what
                        # stops everything collapsing to zero.

epsilon_path: 0.25      # The same tolerance on the k >= 2 constraint:
                        #
                        #   E_{2 <= j-i <= path_max_gap}[
                        #       relu(d(s_i, s_j) - (j - i) * step_cost)^2] <= epsilon_path^2
                        #
                        # Deliberately EQUAL to epsilon_local, and deliberately a SEPARATE
                        # key. The deviation is ABSOLUTE rather than per-step (see
                        # path_max_gap for why, and for the cap that makes that safe), so at
                        # gap k the budget k * step_cost + 0.25 allows the same total
                        # overshoot one adjacent step gets. Setting the two apart is how you
                        # would say "a longer sub-path deserves more slack" -- a claim about
                        # the data nobody has measured, so they start equal.
                        #
                        # THE k >= 2 ROWS ARE A SEPARATE CONSTRAINT, NOT THE SAME MEAN.
                        # They were merged into the k = 1 mean once, in run 0lcrduzl, and the
                        # merge is what this split undoes. A mean divides by every pair and a
                        # one-sided constraint leaves most of the wide set at exactly zero.
                        # Step 1 of 0lcrduzl against 1wbpyf2g, identical seed-42 batch:
                        #
                        #   set        pairs   violating     sum(dev^2)   mean
                        #   k = 1        489   486 (99.4%)        969.4   1.982
                        #   k >= 2     3,119   418 (13.4%)        226.3   0.073
                        #   pooled     3,608   904 (25.1%)      1,195.7   0.331
                        #
                        # The k = 1 rows carried 81% of the violation and got 13.5% of the
                        # weight; local_dist_mean went 2.263 -> 3.009 over 20 steps where the
                        # same lambda on k = 1 alone had taken it 2.263 -> 1.390.
                        #
                        # The k >= 2 rows are redundant in exact arithmetic (the triangle
                        # inequality carries k = 1 to every k) and load-bearing in practice,
                        # because k = 1 is enforced through a MEAN and a mean averages a heavy
                        # tail away. On loj243n4 the adjacent-step mean held at 1.418 with a
                        # max of 6.721 and 80% of transitions over cost, while
                        # same-trajectory pairs at a mean gap of 2.010 measured 11.162 against
                        # the 2.85 that implies. That leak is what this measures.

path_max_gap: 3         # Largest observed gap j - i the PATH constraint is applied at.
                        # The path set is 2 <= j - i <= path_max_gap; 0 = unlimited, the same
                        # reading push_chunk_cols: 0 has. k = 1 is never in this set -- it is
                        # the local constraint, under its own multiplier -- so
                        # path_max_gap: 1 makes the path set EMPTY, which is the local-only
                        # ablation and is legal:
                        #   bash qrl_prm/train.sh --set qrl.path_max_gap=1 --set run.name=qrl_k1
                        #
                        # 3, BECAUSE THE DEVIATION IS ABSOLUTE AND AN ABSOLUTE DEVIATION LETS
                        # LONG GAPS DOMINATE THE MEAN. At gap k a metric inflated to d ~ 3k
                        # deviates by 2k, so dev^2 ~ 4k^2 and one gap-20 pair carries 100x
                        # what a gap-2 pair does. Uncapped (path_gap_max was 20 on probe
                        # 0lcrduzl) the k >= 2 mean would be steered by the longest
                        # sub-paths -- "the constraint controlled the mean, not the tail",
                        # relocated one level up -- and aimed at the wrong gaps: loj243n4's
                        # damage was at probe16/goal_offset_mean 2.010, i.e. k ~ 2.
                        #
                        # The cap also CONCENTRATES the violation, which is what makes
                        # init_lagrange_path meaningful. Step 1 of 0lcrduzl, k >= 2 uncapped:
                        # violation +0.010, i.e. already satisfied and nothing to integrate.
                        # Capped at k <= 3: ~+0.202, 20x more, from the same pairs -- the ones
                        # dropped are the ones that were diluting the signal.
                        #
                        # The alternative to a cap is a PER-STEP deviation,
                        # ((d - k*c).relu() / k)^2, which makes every gap contribute in the
                        # same units and needs no cap. Considered and not taken: it changes
                        # what epsilon_path asserts, and the absolute form is upstream's.
                        # qrl/path_ratio_mean logs the per-step quantity either way.

epsilon_cf: 0.2         # NO QRL COUNTERPART: counterfactual invariance is this project's
                        # term. It is the radius of the ball two meaning-preserving wordings
                        # of one step may sit in, in BOTH directions, so the class diameter
                        # is bounded by 2 * epsilon_cf = 0.4 via the triangle inequality.
                        # It must stay far below the ruler a verdict is read against -- the
                        # old margin ruler is 2 log 2 = 1.3863 (§7.6) -- or a paraphrase
                        # could move a step across the decision boundary, which is the exact
                        # failure (4) L_CF exists to prevent. config.py rejects any value at
                        # or above 1.3863.

init_lagrange_local: 5.0
                        # NOT QRL's default. Upstream starts its multipliers at 0.01
                        # (losses/local_constraint.py:31) and trains for 2e5 steps; this run
                        # gets ~1,464, and AdamW on the dual is a rate-limited integrator --
                        # it normalises by running gradient magnitude, so `raw` advances at
                        # ~lagrange_lr per step whether the violation is 172 or 0.16. On
                        # `loj243n4` that meant 600 steps -- 41% of the run -- just to climb
                        # from 0.01 to the 1.33 where the adjacent-step mean finally turned
                        # over, with the push term unopposed for all of them. The result was
                        # scale inflation, not structure: same_traj/cross_question was 0.851
                        # at step 1 and 0.876 at step 1460.
                        #
                        # THIS IS THE RULER. qrl/local_dist_mean -> step_cost is the curve the
                        # run is steered by, and it is the one upstream's local_constraint.py
                        # holds.
                        #
                        # 5.0 FROM A MEASURED DESTINATION, NOT THE ANALYTIC ONE. At the
                        # epsilon boundary d = 1.25 the push and constraint gradients balance
                        # when 2*lambda*(d-1) == sigmoid(beta*(offset-d)), giving
                        # sigmoid(0.1*23.75)/0.5 = 1.83 at offset 25. But loj243n4 SETTLED at
                        # lambda_local 3.479 by step 1460 -- 1.90x that estimate -- with
                        # local_dist_mean still at 1.482 rather than 1.25, i.e. 3.479 was a
                        # lower bound that had not converged when the run ended. On top of
                        # that, cf_pos_neg_push_weight did not exist when 3.479 was measured
                        # and now carries ~34% of the objective, all of it expansion pressure
                        # on psi. 5.0 is 3.479 with that headroom.
                        #
                        # STARTING HIGH IS THE SAFE DIRECTION. The constraint is one-sided --
                        # (d - step_cost).relu().square() -- so it costs exactly nothing below
                        # the step cost: a large lambda_local cannot crush distances below
                        # 1.0, only stop overshoot, and there is no collapse mode on that
                        # side. It applies ONLY to same-trajectory adjacent pairs while the
                        # push applies to every (state, goal) pair, so a high lambda_local
                        # pins observed steps near their step count and leaves the push free
                        # to expand everything else -- which IS the same_traj/cross_question
                        # gap the 0.01 run failed to produce. And overshoot self-corrects:
                        # the violation goes negative and the multiplier descends at the same
                        # rate, where undershoot drives distances past the offset into the
                        # flat region with no gradient left to fix them.
                        #
                        # WATCH `qrl/lagrange_local` FALL. Under-shooting looks like a
                        # monotonic climb, which is what the 0.01 run did for 1,460 steps. If
                        # this settles or drifts down, the init was right or slightly high and
                        # the dual is doing its job. If it climbs from 5.0 without
                        # local_sq_dev falling, the equilibrium is genuinely higher and the
                        # next move is lagrange_lr, not another init bump.

init_lagrange_path: 3.0
                        # ARMED LOWER THAN k = 1, ON PURPOSE.
                        #
                        # Analytic equilibrium at offset 25, absolute deviation, at the
                        # epsilon boundary:
                        #   k = 1, d = 1.25 -> sigmoid(0.1 * 23.75) / 0.5 = 1.83
                        #   k = 2, d = 2.25 -> sigmoid(0.1 * 22.75) / 0.5 = 1.81
                        #   k = 3, d = 3.25 -> sigmoid(0.1 * 21.75) / 0.5 = 1.80
                        # They agree to ~1%, because the deviation at the boundary is epsilon
                        # in every case and the push gradient barely moves across the gap
                        # range. Scaling 1.81 by the 1.90x empirical-over-analytic factor
                        # loj243n4 measured for k = 1 gives 3.44 -> 3.0.
                        #
                        # IT DOES NOT GET lambda_local's 5.0 UPLIFT. That uplift is for
                        # "3.479 had not converged after 1,464 steps", a measurement about
                        # k = 1 ONLY. The k >= 2 constraint is in the opposite situation: with
                        # path_max_gap = 3 its step-1 violation is ~+0.202 against the k = 1
                        # constraint's +1.920, i.e. 9.5x less violated. Arming a
                        # nearly-satisfied backstop harder than the badly-violated ruler has
                        # nothing behind it.
                        #
                        # AND IT IS A BACKSTOP. d(s_i, s_j) <= (j-i) * step_cost is implied by
                        # k = 1 through the triangle inequality; these rows exist only because
                        # k = 1 is enforced softly and a mean averages a heavy tail away.
                        # Under-arming a backstop is cheap -- the dual climbs ~0.01/step and
                        # reaches 5.0 by ~step 200 on its own. Under-arming the ruler is what
                        # cost loj243n4 600 steps.
                        #
                        # WHICH GAPS CARRY THE VIOLATION FLIPS DURING THE RUN. At init psi
                        # barely grows the distance with the gap (~3.3 at every k, measured),
                        # so the short gaps carry all of it and this term sits armed rather
                        # than working. Once the push has expanded same-trajectory pairs it
                        # inverts: on loj243n4 a gap-2 pair at 11.16 contributes
                        # (11.16-2)^2 = 84. Splitting the means is what keeps that inversion
                        # out of the k = 1 constraint -- which is exactly what the merged
                        # version failed to do.

init_lagrange_cf: 3.0
                        # RAISED from QRL's 0.01, on the same "initialise at the destination"
                        # argument and a measurement that reads the opposite way to how it
                        # was first reported.
                        #
                        # loj243n4 was cited as evidence that the CF constraint converges on
                        # its own inside the budget: it ended cf_sq_dev 0.128 against
                        # epsilon_cf^2 = 0.04 and cf_violation 0.088, from an init violation
                        # of 3.62. True -- but its FINAL lambda_cf was 5.336. Getting there
                        # from 0.01 means moving `raw` from -4.60 to +5.34 at ~lagrange_lr per
                        # step: ~994 steps, 68% of the run. The constraint converged BARELY,
                        # and the clock ate two thirds of the budget doing it.
                        #
                        # It is now worse, because cf_pos_neg_push_weight is new and is by
                        # construction the direct negation of this constraint: it pushes
                        # rewrites of one step apart while this pulls them together, and it
                        # carries ~34% of the objective. Measured on probe 0lcrduzl,
                        # cf_violation reached 7.411 by step 20 against loj243n4's 5.924 on
                        # the identical batch -- 25% higher and rising 1.6x faster.
                        #
                        # 3.0 RATHER THAN 5.336, because this constraint is NOT one-sided the
                        # way the path pair are. cf_sq_dev is mean(relu(d)^2) against a target
                        # of 0, so the gradient is always live and a large enough lambda_cf
                        # CAN collapse an equivalence class to a point. 5.336 is empirically
                        # safe -- loj243n4 sat there with cf_dist_mean 0.236, above
                        # epsilon_cf = 0.2 -- but that was without pos_neg_push. 3.0 banks
                        # ~800 steps of the climb and leaves the dual to finish it, which is
                        # the direction that self-corrects.
                        #
                        # Stored as softplus_inv(3.0); the trained quantity is the raw
                        # pre-softplus scalar, so the multiplier can never go negative.

lagrange_lr: 0.01       # losses/__init__.py:47 -- QRL's `lagrange_mult_optim` lr 1e-2, its
                        # own AdamW at betas (0.9, 0.999), weight_decay 0, CONSTANT. The dual
                        # variable must track the constraint for the whole run, so it does
                        # NOT ride the primal's cosine decay. Note the betas differ from the
                        # main optimiser's (0.9, 0.95) on purpose: this is QRL's spec.

cf_neg_push_weight: 1.0 # Weight on the CF-NEGATIVE push term. CF negatives enter as SOURCES:
                        # softplus(offset - d(psi(prefix + neg), psi_g)) over same-question goal
                        # columns -- the eval-aligned direction, a broken state as the source
                        # of the query. They are NEVER in the CF constraint (that would assert
                        # two different wrong steps are the same point). 0.0 makes the term an
                        # exact zero with `qrl/neg_push_*` still logged.

cf_pos_neg_push_weight: 1.0
                        # Weight on the POSITIVE-vs-NEGATIVE push: softplus(offset - d) over
                        # BOTH directions of every (class member, negative) pair inside one CF
                        # example, class members being the anchor and its positives.
                        #
                        # This is the direct negation of the CF constraint and it closes the
                        # gap that constraint left open. epsilon_cf says a meaning-PRESERVING
                        # rewrite of step i is the same point as the original. Nothing said a
                        # meaning-BREAKING rewrite of that step is a DIFFERENT one --
                        # cf_neg_push_weight does not say it either, being a claim about
                        # reaching the ANSWER. A metric can hold d(neg, goal) large and still
                        # place the broken rewrite on top of the correct one, and then a
                        # paraphrase-sized perturbation moves a step across the verdict
                        # boundary, which is failure (4) from the other side.
                        #
                        # BOTH directions, as the constraint binds both: you cannot reach a
                        # broken step from a correct one, and you cannot recover back. SAME
                        # EXAMPLE only -- across examples these are rewrites of different
                        # steps and their distance asserts nothing.
                        #
                        # READ `qrl/pos_neg_push_gap` = pos_neg_push_dist_mean - cf_dist_mean.
                        # Both sides are pairs of rewrites of the SAME step, so it isolates
                        # "broken" from "reworded" with the step held fixed. It should OPEN.
                        # 0.0 makes the term an exact zero with `qrl/pos_neg_push_*` logged.

cf_encode_max_tokens: 16384
                        # PADDED-TOKEN BUDGET FOR THE CF VARIANT FORWARD, counted the way the
                        # GPU pays for it: sequences x longest, not the token sum.
                        #
                        # THIS IS THE KNOB `data.cf_max_per_batch` USED TO BE. Under the old
                        # `cf_phi` path a rewritten step cost an embedding lookup and an MLP
                        # (§7.5.3 option (b)), because `phi` PREDICTED the arrived state from a
                        # prefix the main batch had already forwarded. There is no phi here:
                        # the environment is deterministic, so the arrived state is
                        # psi(prompt + steps[:i] + variant + SEP) and it is READ, through a
                        # real second LM forward (qrl_prm/cf_encode.py). At
                        # data.cf_max_per_batch = 12 and ~8 rewrites per example that is ~96
                        # sequences against a main batch of ~51.
                        #
                        # 16384 is half `sampling.max_padded_tokens`, the main batch's own cap.
                        # Whole EXAMPLES are dropped off the TAIL of the seeded selection order
                        # once the budget is met -- never individual variants (half a class is
                        # a different constraint, not a smaller one) and never the longest
                        # (that would train the constraint on short steps only, and no curve
                        # would say so). The drop is counted in `cf/examples_dropped_budget`.
                        #
                        # READ `cf/encode_padded_tokens` AGAINST IT and `launch/memory_probe`'s
                        # `cf_encode` block. If the card cannot take both forwards, lower this
                        # before lowering `data.cf_max_per_batch` -- it trims per batch, where
                        # the cap trims the corpus's coverage across the epoch.

push_chunk_cols: 0      # 0 = build the (S, C) push matrix in one shot (~404 x 172 ~ 69k
                        # pairs). A positive value splits it into chunks of that many GOAL
                        # COLUMNS and accumulates the mean EXACTLY (weighted by each chunk's
                        # column count -- tests pin chunked == unchunked). It lowers the
                        # TRANSIENT peak of the distance's internals, which matters for IQE
                        # (it materialises several (S, C, D/k, 2k) fp32 tensors); it does NOT
                        # shrink the autograd graph. Reach for it only if
                        # `launch/memory_probe` says the card cannot take the one-shot form.
